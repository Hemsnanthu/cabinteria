
<div class="order-page">

  <button class="back-btn" (click)="goBack()">← Back</button>

  <div class="order-card" *ngIf="items.length > 0; else emptyCart">

    <h2>🧾 Order Summary</h2>

    <table class="order-table">
      <thead>
        <tr>
          <th>Food</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Total</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of items">
          <td>{{ item.name }}</td>
          <td>{{ item.quantity }}</td>
          <td>₹ {{ item.price }}</td>
          <td>₹ {{ item.price * item.quantity }}</td>
        </tr>
      </tbody>
    </table>

    <div class="total-section">
      <h3>Grand Total</h3>
      <span>₹ {{ total }}</span>
    </div>

    <!-- 🔥 NEW SECTION -->
    <div class="extra-details">
      <label>Cabin</label>
      <select [(ngModel)]="cabin">
        <option value="">Select Cabin</option>
        <option *ngFor="let c of cabins" [value]="c">{{ c }}</option>
      </select>

      <label>Table Number</label>
      <input type="number" [(ngModel)]="tableNumber" placeholder="Enter table no">

      <label>Payment Method</label>
      <select [(ngModel)]="paymentMethod">
        <option value="">Select Payment</option>
        <option value="CASH">Cash</option>
        <option value="UPI">UPI</option>
        <option value="CARD">Card</option>
      </select>
    </div>

    <button 
      (click)="confi()" 
      class="confirm-btn"
      [disabled]="loading">
      {{ loading ? 'Processing...' : 'Confirm Order' }}
    </button>

  </div>

  <!-- Empty Cart -->
  <ng-template #emptyCart>
    <div class="order-card empty">
      <h3>🛒 No items in cart</h3>
      <button (click)="goBack()">Go Back</button>
    </div>
  </ng-template>

</div>

<!-- Success Modal -->
<div class="custom-modal" *ngIf="showAlert">
  <div class="modal-box">
    <h3>✅ Order Placed!</h3>
    <p>Your order has been placed successfully.</p>

    <!-- 🔥 Show Order Details -->
    <p><strong>Order ID:</strong> {{ orderId }}</p>
    <p><strong>Time:</strong> {{ orderTime }}</p>

    <button (click)="closeAlert()">OK</button>
  </div>
</div>
