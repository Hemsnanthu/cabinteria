<app-header></app-header>
<div class="login-bg">
<div class="container d-flex justify-content-center align-items-center vh-100 bg-net">
  <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
    <h2 class="text-center mb-4">🔑 Login</h2>

    <form [formGroup]="Userlogin">
      <!-- Username -->
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input 
          type="text" 
          id="name" 
          class="form-control" 
          placeholder="Enter your name" 
          formControlName="username"
          autocomplete="username">
          
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-control" 
          placeholder="Enter your password" 
          formControlName="password"
          autocomplete="username">
      </div>

      <!-- Login Button -->
      <div class="d-grid">
        <button type="button" class="btn btn-primary" (click)="logincontrol()">Login</button>
      </div>

      <!-- Signup Link -->
      <div class="text-center mt-3">
        <strong>
          Don't have an account? 
          <a routerLink="/register" class="text-decoration-none">Sign Up</a>
        </strong>
      </div>
    </form>
  </div>
</div>
</div>
<app-footer></app-footer>
